# App icon generation from icon.png — rerun after changing the image:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "icon.png"
  android: true
  # Adaptive icon: launcher masks crop our full-bleed art; the background
  # color matches the icon's own dark teal so any exposed ring blends in.
  adaptive_icon_background: "#0B4544"
  adaptive_icon_foreground: "icon.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0B4544"
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#0B4544"
    theme_color: "#0B4544"
  windows:
    generate: true
    image_path: "icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "icon.png"
